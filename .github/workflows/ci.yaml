name: Build Hyperland

on: [push, pull_request, workflow_dispatch]
jobs:
  gcc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: "Build Hyperland (Arch)"
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout repository actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - name: Setup base
        uses: ./.github/actions/setup_base
        with:
          INSTALL_XORG_PKGS: true

      - name: Build Hyperland
        run: |
          make nopch

      - name: Smoke test and install layout
        run: |
          ./build/Hyperland --version
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          for f in Hyperland hyperland Hyprland hyprland hyperctl hyprctl hyperpm hyprpm start-hyperland start-hyprland; do
            test -e "stage/usr/bin/$f" || { echo "missing /usr/bin/$f"; exit 1; }
          done
          for f in hyperland.desktop hyprland.desktop hyperland-uwsm.desktop hyprland-uwsm.desktop; do
            test -e "stage/usr/share/wayland-sessions/$f" || { echo "missing session $f"; exit 1; }
          done
          test -e stage/usr/share/pkgconfig/hyprland.pc
          test -e stage/usr/share/pkgconfig/hyperland.pc
          test -e stage/usr/share/hypr/hyperland.conf
          test -e stage/usr/share/hypr/hyprland.conf

      - name: Compress and package artifacts
        run: |
          mkdir x86_64-pc-linux-gnu
          mkdir hyperland
          cp ./LICENSE hyperland/
          cp build/Hyperland hyperland/
          cp build/hyprctl/hyperctl hyperland/
          cp build/hyprpm/hyperpm hyperland/
          cp -r example/ hyperland/
          cp -r assets/ hyperland/
          tar -cvJf Hyperland.tar.xz hyperland

      - name: Release
        uses: actions/upload-artifact@v4
        with:
          name: Build archive
          path: Hyperland.tar.xz

  clang-format:
    permissions: read-all
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: "Code Style"
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: clang-format check
      #   uses: jidicula/clang-format-action@v4.16.0
      #   with:
      #     exclude-regex: ^subprojects$

      - name: Install clang-format
        run: |
          pacman --noconfirm --noprogressbar -Syyu
          pacman --noconfirm --noprogressbar -Sy clang

      - name: clang-format check
        run: .github/workflows/clang-format-check.sh "." "llvm" "^subprojects$" ""

      - name: Save PR head commit SHA
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "SHA=$SHA" >> $GITHUB_ENV
      - name: Save latest commit SHA if not PR
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: echo "SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Report failure in job summary
        if: failure()
        run: |
          DEEPLINK="${{ github.server_url }}/${{ github.repository }}/commit/${{ env.SHA }}"
          echo -e "Format check failed on commit [${GITHUB_SHA:0:8}]($DEEPLINK) with files:\n$(<$GITHUB_WORKSPACE/failing-files.txt)" >> $GITHUB_STEP_SUMMARY
