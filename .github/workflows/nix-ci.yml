name: Nix

on: [push, pull_request, workflow_dispatch]

jobs:
  # flake.lock is pinned to the Hyprland 0.54 ecosystem on purpose: no automatic input updates.
  hyperland:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    uses: ./.github/workflows/nix.yml
    secrets: inherit
    with:
      command: nix build 'github:${{ github.repository }}?rev=${{ github.sha }}' -L --extra-substituters "https://hyprland.cachix.org"

  xdph:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    needs: hyperland
    uses: ./.github/workflows/nix.yml
    secrets: inherit
    with:
      command: nix build 'github:${{ github.repository }}?rev=${{ github.sha }}#xdg-desktop-portal-hyprland' -L --extra-substituters "https://hyprland.cachix.org"

  test:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork)
    uses: ./.github/workflows/nix-test.yml
    secrets: inherit
